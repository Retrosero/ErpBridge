# ============================================================================
# docker-compose.coolify.yml
#
# Coolify's "Docker Compose" deployment source. Paste this into Coolify's
# "Docker Compose" service; Coolify will parse it and expose each `service`
# as an individually deployable application, with the `coolify.environment`
# keys automatically wired into the application's Environment tab.
#
# Two services are defined:
#   * centralapi — the Web API + PostgreSQL backend. Binds to a managed
#     Coolify PostgreSQL via the Service variable substitution.
#   * admin      — the Blazor Server admin panel. Calls the central API
#     over the internal Docker network.
#
# Secrets (never commit): JWT_SIGNING_KEY, ADMIN_SEED_PASSWORD,
# POSTGRES_PASSWORD. Configure them as "Secret" type in Coolify's
# per-service Environment tab, NOT as plain values.
#
# Internal container ports are 4001 (centralapi) and 4002 (admin) -
# these are the values the application binds inside its container.
# Coolify fronts the containers with Traefik on HTTPS 443, so external
# callers hit the public FQDN and never see these ports directly.
# ============================================================================

x-erpbridge-common: &erpbridge-common
  restart: unless-stopped
  # Match the Dockerfile's runtime user; Coolify's UID is fine.
  user: "1000:1000"

services:
  # --------------------------------------------------------------------------
  # Central API + PostgreSQL-backed background services.
  # --------------------------------------------------------------------------
  centralapi:
    <<: *erpbridge-common
    container_name: erpbridge-centralapi
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: centralapi
        VERSION: ${GIT_HASH:-latest}
    image: erpbridge/centralapi:${GIT_HASH:-latest}
    # Container-side port. Coolify fronts this with Traefik on HTTPS 443,
    # so external callers hit https://api.erpbridge.example.com and never
    # see 4001. Change here if 4001 is taken on the host.
    ports:
      - "4001:4001"
    environment:
      # Coolify wires these from the per-service Environment tab. Override
      # the defaults here only for local docker compose up.
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__CentralApi: Host=postgres;Port=5432;Database=erpbridge;Username=erpbridge;Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ErpBridge.CentralApi
      Jwt__Audience: ErpBridge.Agents
      Jwt__AccessTokenMinutes: "60"
      Admin__SeedEmail: ${ADMIN_SEED_EMAIL}
      Admin__SeedPassword: ${ADMIN_SEED_PASSWORD}
      Admin__SeedDisplayName: Bootstrap Admin
      PORT: "4001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Coolify injects its own Traefik labels and DNS via the UI; nothing to
    # add here. The service is reachable at
    # https://${COOLIFY_FQDN_CENTRALAPI}.

  # --------------------------------------------------------------------------
  # Blazor Server admin panel. Talks to the central API via the internal
  # Docker network using the central API's service hostname.
  # --------------------------------------------------------------------------
  admin:
    <<: *erpbridge-common
    container_name: erpbridge-admin
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: admin
        VERSION: ${GIT_HASH:-latest}
    image: erpbridge/admin:${GIT_HASH:-latest}
    ports:
      - "4002:4002"
    depends_on:
      centralapi:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The admin panel calls the central API; it must know its base URL.
      # We use the internal Docker network name "centralapi". For an
      # external URL (e.g. https://api.erpbridge.example.com) override
      # here or in the Coolify environment tab.
      CentralApi__BaseUrl: ${CENTRALAPI_BASE_URL:-http://centralapi:4001}
      PORT: "4002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4002/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

# ============================================================================
# Coolify Service database — managed PostgreSQL. Defined here as a placeholder;
# in production we attach the Coolify-managed Postgres resource and just
# reference it by name via ConnectionStrings__CentralApi.
#
# networks:
#   coolify:
#     name: coolify
# ============================================================================